<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中1理科：鏡に映る像のでき方</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&display=swap');
    
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      touch-action: none;
    }

    /* ステップボタンのアクティブ演出 */
    .step-pill {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .step-pill.active {
      transform: scale(1.04);
      box-shadow: 0 0 18px rgba(250, 204, 21, 0.45);
    }

    /* ボタンを押したときのフィードバック */
    .btn-touch:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body class="flex flex-col justify-between w-screen h-screen overflow-hidden">

  <!-- 上部ヘッダー（文字表示がONのときだけ解説バナーを表示） -->
  <header id="headerBar" class="w-full bg-slate-900/95 border-b-2 border-slate-800 px-6 py-2.5 flex items-center justify-between shrink-0 z-10 shadow-lg min-h-[68px]">
    <div class="flex items-center gap-4">
      <div class="bg-amber-400 text-slate-950 font-black px-3.5 py-1 rounded-xl text-lg md:text-xl tracking-wider shadow">
        中1理科
      </div>
      <h1 class="text-xl md:text-2xl font-black tracking-tight text-slate-200">
        鏡に映る「像」のでき方
      </h1>
    </div>

    <!-- 現在の状態メッセージボックス（デフォルトは非表示） -->
    <div id="statusBanner" class="hidden items-center gap-3 bg-slate-800 border-2 border-amber-400/80 px-5 py-1.5 rounded-2xl shadow-inner">
      <span id="statusIcon" class="text-2xl">💡</span>
      <p id="statusText" class="text-lg md:text-xl font-bold text-amber-300 tracking-wide">
        「光を出す」ボタンを押して、光の進み方を見てみよう
      </p>
    </div>
  </header>

  <!-- 中央メインキャンバス領域（1画面に収まるよう残り高さを100%使用） -->
  <main class="relative flex-1 w-full h-full overflow-hidden bg-slate-950">
    <canvas id="simCanvas" class="w-full h-full block"></canvas>
  </main>

  <!-- 下部コントロールバー：iPadで押しやすい特大ボタン -->
  <footer class="w-full bg-slate-900 border-t-2 border-slate-800 px-6 py-3 flex items-center justify-between gap-4 shrink-0 z-10">
    
    <!-- 左：光源から光を出すボタン ＆ 光を消すボタン -->
    <div class="flex items-center gap-3">
      <button id="emitLightBtn" class="btn-touch flex items-center gap-3 bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-300 hover:to-orange-300 text-slate-950 font-black text-xl md:text-2xl px-7 py-3 rounded-2xl shadow-lg border-2 border-amber-200 cursor-pointer">
        <span id="emitIcon" class="text-2xl">💡</span>
        <span id="emitLabel">光源から光を出す</span>
      </button>

      <button id="clearLightBtn" class="btn-touch bg-slate-800 hover:bg-slate-700 text-slate-300 border-2 border-slate-600 font-bold text-lg md:text-xl px-5 py-3 rounded-2xl shadow cursor-pointer">
        光を消す
      </button>
    </div>

    <!-- 中央：4ステップ進行ボタン（文字表示がONのとき、または段階確認用に利用可能） -->
    <div id="stepBar" class="hidden xl:flex items-center gap-1.5 bg-slate-800/90 p-1.5 rounded-2xl border border-slate-700">
      <button data-step="1" class="step-pill btn-touch px-3.5 py-2 rounded-xl font-bold text-base text-slate-300 flex items-center gap-1.5 cursor-pointer">
        <span class="bg-slate-700 text-amber-300 px-2 py-0.5 rounded-lg text-sm">1</span>
        <span>鏡へ</span>
      </button>
      <span class="text-slate-600 font-black">▶</span>
      <button data-step="2" class="step-pill btn-touch px-3.5 py-2 rounded-xl font-bold text-base text-slate-300 flex items-center gap-1.5 cursor-pointer">
        <span class="bg-slate-700 text-amber-300 px-2 py-0.5 rounded-lg text-sm">2</span>
        <span>反射</span>
      </button>
      <span class="text-slate-600 font-black">▶</span>
      <button data-step="3" class="step-pill btn-touch px-3.5 py-2 rounded-xl font-bold text-base text-slate-300 flex items-center gap-1.5 cursor-pointer">
        <span class="bg-slate-700 text-cyan-300 px-2 py-0.5 rounded-lg text-sm">3</span>
        <span>延長線</span>
      </button>
      <span class="text-slate-600 font-black">▶</span>
      <button data-step="4" class="step-pill btn-touch px-3.5 py-2 rounded-xl font-bold text-base text-slate-300 flex items-center gap-1.5 cursor-pointer">
        <span class="bg-slate-700 text-pink-300 px-2 py-0.5 rounded-lg text-sm">4</span>
        <span>像の位置</span>
      </button>
    </div>

    <!-- 右：文字表示のON/OFF切り替え ＆ 対称距離の切り替え ＆ リセット -->
    <div class="flex items-center gap-3">
      <button id="toggleTextBtn" class="btn-touch bg-slate-800 hover:bg-slate-700 text-slate-300 border-2 border-slate-600 font-bold text-lg md:text-xl px-5 py-3 rounded-2xl shadow cursor-pointer flex items-center gap-2">
        <span id="textCheck">☐</span>
        <span>文字・解説を表示</span>
      </button>

      <button id="toggleSymmetryBtn" class="btn-touch bg-slate-800 hover:bg-slate-700 text-slate-300 border-2 border-slate-600 font-bold text-lg md:text-xl px-5 py-3 rounded-2xl shadow cursor-pointer flex items-center gap-2">
        <span id="symCheck">☐</span>
        <span>対称の線を引く</span>
      </button>

      <button id="resetBtn" class="btn-touch bg-slate-800 hover:bg-slate-700 text-slate-300 border-2 border-slate-600 font-bold text-lg md:text-xl px-4 py-3 rounded-2xl shadow cursor-pointer" title="光源の位置を最初に戻します">
        位置リセット
      </button>
    </div>
  </footer>

  <script>
    /**
     * 中1理科：鏡に映る像のでき方シミュレーター
     * ・デフォルトでは文字は非表示（先生の解説や生徒の気づきを妨げない）
     * ・デフォルトでは光源から光は出ていない（ボタンを押すか光源をタップするとゆっくり光が出る）
     * ・文字を表示した際も、光の道筋（入射光・反射光・延長線）に一切重ならない外側に配置
     */
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // UI要素
    const statusBanner = document.getElementById('statusBanner');
    const statusIcon = document.getElementById('statusIcon');
    const statusText = document.getElementById('statusText');
    const emitLightBtn = document.getElementById('emitLightBtn');
    const emitIcon = document.getElementById('emitIcon');
    const emitLabel = document.getElementById('emitLabel');
    const clearLightBtn = document.getElementById('clearLightBtn');
    const toggleTextBtn = document.getElementById('toggleTextBtn');
    const textCheck = document.getElementById('textCheck');
    const toggleSymmetryBtn = document.getElementById('toggleSymmetryBtn');
    const symCheck = document.getElementById('symCheck');
    const resetBtn = document.getElementById('resetBtn');
    const stepButtons = document.querySelectorAll('.step-pill');

    // キャンバスサイズと座標系
    let width = 0;
    let height = 0;
    let mirrorX = 0;
    let gridSize = 60;

    // 光源と目の位置（鏡からの相対座標）
    let sourceRelX = -210;
    let sourceRelY = -120;
    let eyeRelX = -240;
    let eyeRelY = 165;

    // ドラッグ・タップ判定用
    let isDraggingSource = false;
    let pointerDownX = 0;
    let pointerDownY = 0;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let hoverSource = false;

    // 表示・アニメーション状態管理（デフォルトは光も文字もOFF）
    let isLightActive = false;       // 光源から光が出ているかどうか
    let animProgress = 0;            // 0.0 〜 1.0
    let isAnimatingProcess = false;  // 光が伸びている最中かどうか
    // 光の進むスピード：じっくり観察・解説できるようゆっくりに設定（約11〜12秒で完了）
    const animSpeed = 0.0014;
    let pulseTime = 0;               // 完了後のゆっくりした光の粒の移動用

    let showLabels = false;          // 文字・解説表示（デフォルトOFF）
    let showSymmetryGuide = false;   // 対称の補助線表示（デフォルトOFF）

    // キャンバスリサイズ処理
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      width = rect.width;
      height = rect.height;

      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      mirrorX = Math.round(width / 2);
      gridSize = Math.max(48, Math.min(72, Math.floor((width / 2) / 7.5)));

      clampPositions();
    }

    function setInitialPositions() {
      sourceRelX = -gridSize * 3.5;
      sourceRelY = -gridSize * 1.8;
      eyeRelX = -gridSize * 4.0;
      eyeRelY = gridSize * 2.4;
      clampPositions();
    }

    function clampPositions() {
      const minX = -mirrorX + 100;
      const maxX = -gridSize * 1.2;
      const minY = -height / 2 + 95;
      const maxY = height / 2 - 150;

      sourceRelX = Math.max(minX, Math.min(maxX, sourceRelX));
      sourceRelY = Math.max(minY, Math.min(maxY, sourceRelY));

      eyeRelX = Math.max(-mirrorX + 120, -gridSize * 4.2);
      eyeRelY = Math.min(height / 2 - 80, gridSize * 2.5);
    }

    // ステータス表示とボタン状態の更新
    function updateStatusUI() {
      // ステップボタンのハイライトクリア
      stepButtons.forEach(btn => {
        btn.classList.remove('active', 'bg-slate-700', 'border', 'border-amber-400');
      });

      if (!isLightActive) {
        statusIcon.textContent = '💡';
        statusText.textContent = '「光源から光を出す」ボタンを押すか、光源をタップしてみよう';
        emitIcon.textContent = '💡';
        emitLabel.textContent = '光源から光を出す';
        return;
      }

      emitIcon.textContent = '🔄';
      emitLabel.textContent = 'もう一度光を出す';

      let currentStep = 4;
      if (animProgress < 0.25) {
        currentStep = 1;
        statusIcon.textContent = '💡';
        statusText.textContent = '① 光源から出た光が、鏡に向かってまっすぐ進みます';
      } else if (animProgress < 0.50) {
        currentStep = 2;
        statusIcon.textContent = '👀';
        statusText.textContent = '② 光が鏡で反射して、目に届きます';
      } else if (animProgress < 0.80) {
        currentStep = 3;
        statusIcon.textContent = '📏';
        statusText.textContent = '③ 目には、光が鏡の奥からまっすぐ進んできたように見えます（点線）';
      } else {
        currentStep = 4;
        statusIcon.textContent = '✨';
        statusText.textContent = '④ 延長線上の、光源と「対称の位置」に像が映って見えます！';
      }

      stepButtons.forEach(btn => {
        const step = parseInt(btn.getAttribute('data-step'), 10);
        if (step === currentStep) {
          btn.classList.add('active', 'bg-slate-700', 'border', 'border-amber-400');
        }
      });
    }

    // 光を最初から出す関数
    function startLightAnimation() {
      isLightActive = true;
      animProgress = 0.0;
      isAnimatingProcess = true;
      pulseTime = 0;
      updateStatusUI();
    }

    // 光を消す関数
    function clearLight() {
      isLightActive = false;
      animProgress = 0.0;
      isAnimatingProcess = false;
      updateStatusUI();
    }

    // ==========================================
    // 描画ヘルパー関数群
    // ==========================================

    // 背景と方眼（グリッド）の描画
    function drawBackgroundAndGrid() {
      const centerY = height / 2;

      // 左側：現実の世界（手前）
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, mirrorX, height);

      // 右側：鏡の奥の世界
      ctx.fillStyle = '#131c38';
      ctx.fillRect(mirrorX, 0, width - mirrorX, height);

      // 方眼の描画（鏡の位置 mirrorX と 画面中央 centerY を基準に対称に引く）
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.15)';

      for (let offset = gridSize; offset < width / 2; offset += gridSize) {
        ctx.beginPath();
        ctx.moveTo(mirrorX - offset, 0);
        ctx.lineTo(mirrorX - offset, height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(mirrorX + offset, 0);
        ctx.lineTo(mirrorX + offset, height);
        ctx.stroke();
      }

      for (let offset = 0; offset < height / 2; offset += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, centerY - offset);
        ctx.lineTo(width, centerY - offset);
        ctx.stroke();

        if (offset > 0) {
          ctx.beginPath();
          ctx.moveTo(0, centerY + offset);
          ctx.lineTo(width, centerY + offset);
          ctx.stroke();
        }
      }

      // エリアラベル（文字表示ONのときのみ、画面最下部の邪魔にならない位置に表示）
      if (showLabels) {
        ctx.font = 'bold 20px "Noto Sans JP", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(148, 163, 184, 0.5)';
        ctx.fillText('鏡の手前（実際の世界）', mirrorX / 2, height - 18);
        ctx.fillText('鏡の奥の世界', mirrorX + (width - mirrorX) / 2, height - 18);
      }
    }

    // 中央の鏡の描画
    function drawMirror() {
      const topY = 24;
      const bottomY = height - 24;

      // 鏡の裏側を表す斜線（ハッチング）
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2.5;
      const hatchStep = 18;
      for (let y = topY + 10; y < bottomY; y += hatchStep) {
        ctx.beginPath();
        ctx.moveTo(mirrorX, y);
        ctx.lineTo(mirrorX + 16, y + 12);
        ctx.stroke();
      }

      // 鏡本体のライン
      ctx.save();
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 10;
      ctx.strokeStyle = '#e0f2fe';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(mirrorX, topY);
      ctx.lineTo(mirrorX, bottomY);
      ctx.stroke();
      ctx.restore();

      // 鏡の表面のハイライト線
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(mirrorX - 2, topY);
      ctx.lineTo(mirrorX - 2, bottomY);
      ctx.stroke();

      // 「鏡」ラベル（文字表示ONのときのみ、上端の邪魔にならない位置に表示）
      if (showLabels) {
        drawBadge(mirrorX, 34, '鏡', '#0284c7', '#ffffff', 20);
      }
    }

    // 角丸の背景付きテキストバッジを描画する関数
    function drawBadge(x, y, text, bgColor, textColor, fontSize = 20, borderColor = 'rgba(255,255,255,0.25)') {
      ctx.save();
      ctx.font = `900 ${fontSize}px "Noto Sans JP", sans-serif`;
      const metrics = ctx.measureText(text);
      const padX = 14;
      const padY = 8;
      const boxW = metrics.width + padX * 2;
      const boxH = fontSize + padY * 2;

      ctx.fillStyle = bgColor;
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.roundRect(x - boxW / 2, y - boxH / 2, boxW, boxH, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = textColor;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x, y + 1);
      ctx.restore();
    }

    // 光線上の中間地点に進行方向の矢印（▶）を描画する関数
    function drawDirectionArrow(x1, y1, x2, y2, ratio, color, size = 16) {
      const ax = x1 + (x2 - x1) * ratio;
      const ay = y1 + (y2 - y1) * ratio;
      const angle = Math.atan2(y2 - y1, x2 - x1);

      ctx.save();
      ctx.translate(ax, ay);
      ctx.rotate(angle);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(size, 0);
      ctx.lineTo(-size * 0.7, -size * 0.65);
      ctx.lineTo(-size * 0.35, 0);
      ctx.lineTo(-size * 0.7, size * 0.65);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 光源と像の「線対称（同じ距離・垂直）」を示すガイドの描画
    function drawSymmetryGuide(sx, sy, ix, iy, alpha) {
      if (!showSymmetryGuide || alpha <= 0) return;

      ctx.save();
      ctx.globalAlpha = alpha;

      // 1. 光源と像を結ぶ水平な補助線（光線は下側を通るため、この水平線は光線と重ならない）
      ctx.strokeStyle = '#22d3ee';
      ctx.lineWidth = 3;
      ctx.setLineDash([8, 8]);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ix, iy);
      ctx.stroke();
      ctx.setLineDash([]);

      // 2. 鏡との交点に「直角マーク」を描画
      const rightAngleSize = 18;
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(mirrorX - rightAngleSize, sy);
      ctx.lineTo(mirrorX - rightAngleSize, sy - rightAngleSize);
      ctx.lineTo(mirrorX, sy - rightAngleSize);
      ctx.stroke();

      // 3. 文字表示がONのときのみ、光線から離れた上側に距離ラベルを表示
      if (showLabels) {
        const distGrid = Math.abs(mirrorX - sx) / gridSize;
        const distText = `同じ距離（${distGrid.toFixed(1)}マス）`;
        const dimY = Math.max(72, sy - 64);
        drawDimensionArrow(sx, dimY, mirrorX - 6, dimY, '#38bdf8', distText);
        drawDimensionArrow(mirrorX + 6, dimY, ix, dimY, '#f472b6', distText);
      }

      ctx.restore();
    }

    // 距離を表す両矢印とラベルの描画
    function drawDimensionArrow(x1, y1, x2, y2, color, label) {
      const midX = (x1 + x2) / 2;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 2.5;

      ctx.beginPath();
      ctx.moveTo(x1 + 6, y1);
      ctx.lineTo(x2 - 6, y2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x1, y1 - 8);
      ctx.lineTo(x1, y1 + 8);
      ctx.moveTo(x2, y2 - 8);
      ctx.lineTo(x2, y2 + 8);
      ctx.stroke();

      drawBadge(midX, y1, label, '#0f172a', color, 17, color);
      ctx.restore();
    }

    // 光源（電球モチーフ）の描画
    function drawLightSource(x, y, isHoveredOrDragged) {
      ctx.save();

      // ドラッグ可能を示す外周リング
      const ringRadius = isHoveredOrDragged ? 48 : 40;
      ctx.strokeStyle = isHoveredOrDragged ? '#fde047' : 'rgba(250, 204, 21, 0.45)';
      ctx.lineWidth = isHoveredOrDragged ? 3.5 : 2;
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.arc(x, y, ringRadius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // 光が出ているときは明るいグロー、消えているときは控えめなグロー
      const glowRadius = isLightActive ? 54 : 32;
      const grad = ctx.createRadialGradient(x, y, 5, x, y, glowRadius);
      if (isLightActive) {
        grad.addColorStop(0, 'rgba(254, 240, 138, 0.95)');
        grad.addColorStop(0.45, 'rgba(250, 204, 21, 0.45)');
        grad.addColorStop(1, 'rgba(250, 204, 21, 0)');
      } else {
        grad.addColorStop(0, 'rgba(254, 240, 138, 0.4)');
        grad.addColorStop(1, 'rgba(250, 204, 21, 0)');
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
      ctx.fill();

      // 電球のソケット（光線が下に出るのを邪魔しないよう上向きソケットまたはシンプル球体に配置）
      ctx.fillStyle = '#94a3b8';
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(x - 11, y - 30, 22, 12, 4);
      ctx.fill();
      ctx.stroke();

      // 電球ガラス球体
      ctx.fillStyle = isLightActive ? '#fef08a' : '#fde047';
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(x, y, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 中心点
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, Math.PI * 2);
      ctx.fill();

      // ラベル（文字表示ONのときのみ、光線が通る右下側を避けて「左外側」に配置）
      if (showLabels) {
        drawBadge(x - 78, y, '光源', '#ca8a04', '#ffffff', 20, '#fef08a');
      }

      ctx.restore();
    }

    // 鏡に映った「像（虚像）」の描画
    function drawVirtualImage(x, y, appearProgress) {
      if (!isLightActive || appearProgress <= 0) return;

      ctx.save();
      ctx.globalAlpha = appearProgress;

      const scale = 0.75 + 0.25 * Math.sin(appearProgress * Math.PI * 0.5);
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      // 像の後光
      const grad = ctx.createRadialGradient(0, 0, 6, 0, 0, 52);
      grad.addColorStop(0, 'rgba(244, 114, 182, 0.75)');
      grad.addColorStop(0.5, 'rgba(250, 204, 21, 0.3)');
      grad.addColorStop(1, 'rgba(244, 114, 182, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(0, 0, 52, 0, Math.PI * 2);
      ctx.fill();

      // ソケット上部
      ctx.fillStyle = 'rgba(148, 163, 184, 0.6)';
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(-11, -30, 22, 12, 4);
      ctx.fill();
      ctx.stroke();

      // 像のガラス球体（点線枠）
      ctx.fillStyle = 'rgba(254, 240, 138, 0.65)';
      ctx.strokeStyle = '#f472b6';
      ctx.lineWidth = 4;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.arc(0, 0, 22, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.setLineDash([]);

      // 中心点
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // 像のラベル（文字表示ONのときのみ、延長線が来る左下側を避けて「右外側」に配置）
      if (showLabels) {
        ctx.save();
        ctx.globalAlpha = appearProgress;
        drawBadge(x + 78, y, '像', '#be185d', '#ffffff', 20, '#fbcfe8');
        ctx.restore();
      }
    }

    // 観察者の「目」の描画
    function drawObserverEye(ex, ey, targetX, targetY, isReceivingLight) {
      const angle = Math.atan2(targetY - ey, targetX - ex);

      ctx.save();
      ctx.translate(ex, ey);

      if (isLightActive && isReceivingLight) {
        ctx.fillStyle = 'rgba(56, 189, 248, 0.22)';
        ctx.beginPath();
        ctx.arc(0, 0, 42, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.rotate(angle);

      // 白目
      ctx.fillStyle = '#f8fafc';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(-28, 0);
      ctx.quadraticCurveTo(0, -24, 24, -14);
      ctx.quadraticCurveTo(32, 0, 24, 14);
      ctx.quadraticCurveTo(0, 24, -28, 0);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // 瞳
      ctx.fillStyle = '#0284c7';
      ctx.beginPath();
      ctx.ellipse(18, 0, 8, 13, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.ellipse(20, 0, 4.5, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(17, -4, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      // 「目」のラベル（文字表示ONのときのみ、光線が来る右上側を避けて「左外側」に配置）
      if (showLabels) {
        drawBadge(ex - 72, ey, '目', '#1e293b', '#e2e8f0', 20, '#64748b');
      }
    }

    // 光線と延長線・反射アニメーションの描画
    function drawLightRays(sx, sy, rx, ry, ex, ey, ix, iy) {
      if (!isLightActive) {
        // 光が出ていないときも、「対称の線を引く」がONなら補助線を表示できるようにする
        if (showSymmetryGuide) {
          drawSymmetryGuide(sx, sy, ix, iy, 1.0);
        }
        return { p2: 0, p4: 0 };
      }

      // 各ステップの進行度 (0.0 〜 1.0)
      const p1 = Math.max(0, Math.min(1, animProgress / 0.25));               // Step 1: 光源 → 鏡
      const p2 = Math.max(0, Math.min(1, (animProgress - 0.25) / 0.25));      // Step 2: 鏡 → 目
      const p3 = Math.max(0, Math.min(1, (animProgress - 0.50) / 0.30));      // Step 3: 延長線（鏡 → 像）
      const p4 = Math.max(0, Math.min(1, (animProgress - 0.80) / 0.20));      // Step 4: 像の出現

      // 対称ガイドの描画
      if (showSymmetryGuide) {
        drawSymmetryGuide(sx, sy, ix, iy, 1.0);
      }

      // 鏡の法線（点線）
      if (p1 >= 0.95) {
        ctx.save();
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.55)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.beginPath();
        ctx.moveTo(mirrorX - 70, ry);
        ctx.lineTo(mirrorX, ry);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();
      }

      // --------------------------------------------------
      // Step 1: 入射光（光源 S → 反射点 R）
      // --------------------------------------------------
      if (p1 > 0) {
        const curX = sx + (rx - sx) * p1;
        const curY = sy + (ry - sy) * p1;

        ctx.save();
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 12;
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(curX, curY);
        ctx.stroke();
        ctx.restore();

        if (p1 > 0.55) {
          drawDirectionArrow(sx, sy, rx, ry, 0.52, '#fde047', 16);
        }

        if (p1 < 1.0) {
          drawGlowingPhoton(curX, curY, '#fef08a');
        }
      }

      // --------------------------------------------------
      // Step 2: 反射光（反射点 R → 目 E）
      // --------------------------------------------------
      if (p2 > 0) {
        const curX = rx + (ex - rx) * p2;
        const curY = ry + (ey - ry) * p2;

        ctx.save();
        ctx.shadowColor = '#facc15';
        ctx.shadowBlur = 12;
        ctx.strokeStyle = '#fde047';
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.lineTo(curX, curY);
        ctx.stroke();
        ctx.restore();

        if (p2 > 0.55) {
          drawDirectionArrow(rx, ry, ex, ey, 0.52, '#fde047', 16);
        }

        // 反射点の輝き
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 14;
        ctx.beginPath();
        ctx.arc(rx, ry, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (p2 < 1.0) {
          drawGlowingPhoton(curX, curY, '#fef08a');
        }
      }

      // --------------------------------------------------
      // Step 3: 目に入った光の延長線（反射点 R → 像 I へ伸びる点線）
      // --------------------------------------------------
      if (p3 > 0) {
        const curX = rx + (ix - rx) * p3;
        const curY = ry + (iy - ry) * p3;

        ctx.save();
        ctx.shadowColor = '#f472b6';
        ctx.shadowBlur = 10;
        ctx.strokeStyle = '#f472b6';
        ctx.lineWidth = 5;
        ctx.setLineDash([12, 10]);
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(rx, ry);
        ctx.lineTo(curX, curY);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.restore();

        if (p3 < 1.0) {
          drawGlowingPhoton(curX, curY, '#f472b6');
        }
      }

      // --------------------------------------------------
      // 完了後も光の進む向きがわかる、ゆっくりした光粒パルス演出
      // --------------------------------------------------
      if (animProgress >= 1.0) {
        if (pulseTime < 0.45) {
          const t = pulseTime / 0.45;
          const px = sx + (rx - sx) * t;
          const py = sy + (ry - sy) * t;
          drawGlowingPhoton(px, py, '#ffffff', 8);
        } else if (pulseTime < 0.90) {
          const t = (pulseTime - 0.45) / 0.45;
          const px = rx + (ex - rx) * t;
          const py = ry + (ey - ry) * t;
          drawGlowingPhoton(px, py, '#ffffff', 8);
        }
      }

      return { p2, p4 };
    }

    // 光の粒（フォトン）を描画する関数
    function drawGlowingPhoton(x, y, color, radius = 10) {
      ctx.save();
      ctx.fillStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // ==========================================
    // メイン描画ループ
    // ==========================================
    function render() {
      ctx.clearRect(0, 0, width, height);

      const centerY = height / 2;

      // 1. 座標計算
      const sx = mirrorX + sourceRelX;
      const sy = centerY + sourceRelY;

      // 像 I（鏡に対して光源と線対称の位置）
      const ix = mirrorX - sourceRelX;
      const iy = sy;

      // 目 E
      const ex = mirrorX + eyeRelX;
      const ey = centerY + eyeRelY;

      // 鏡の上の反射点 R
      const ratioR = (mirrorX - ex) / (ix - ex);
      const rx = mirrorX;
      const ry = ey + (iy - ey) * ratioR;

      // 2. 背景と方眼の描画
      drawBackgroundAndGrid();

      // 3. 光線と延長線・対称ガイドの描画
      const { p2, p4 } = drawLightRays(sx, sy, rx, ry, ex, ey, ix, iy);

      // 4. 中央の鏡の描画
      drawMirror();

      // 5. 像（虚像）の描画
      drawVirtualImage(ix, iy, p4);

      // 6. 光源の描画
      drawLightSource(sx, sy, isDraggingSource || hoverSource);

      // 7. 目の描画
      drawObserverEye(ex, ey, rx, ry, p2 >= 0.95);

      // 8. アニメーション進行更新（ゆっくり進行）
      if (isLightActive) {
        if (isAnimatingProcess) {
          animProgress += animSpeed;
          if (animProgress >= 1.0) {
            animProgress = 1.0;
            isAnimatingProcess = false;
          }
          updateStatusUI();
        } else {
          // 完了後の光の粒もゆっくり移動させる
          pulseTime = (pulseTime + 0.0035) % 1.0;
        }
      }

      requestAnimationFrame(render);
    }

    // ==========================================
    // タッチ＆マウス操作イベント（iPad対応）
    // ==========================================
    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches && e.touches.length > 0) {
        return {
          x: e.touches[0].clientX - rect.left,
          y: e.touches[0].clientY - rect.top
        };
      }
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    function isPointOnSource(px, py) {
      const sx = mirrorX + sourceRelX;
      const sy = height / 2 + sourceRelY;
      const dist = Math.hypot(px - sx, py - sy);
      return dist <= 65;
    }

    function onPointerDown(e) {
      const pos = getPointerPos(e);
      if (isPointOnSource(pos.x, pos.y)) {
        isDraggingSource = true;
        pointerDownX = pos.x;
        pointerDownY = pos.y;
        const sx = mirrorX + sourceRelX;
        const sy = height / 2 + sourceRelY;
        dragOffsetX = sx - pos.x;
        dragOffsetY = sy - pos.y;
      }
    }

    function onPointerMove(e) {
      const pos = getPointerPos(e);
      if (isDraggingSource) {
        e.preventDefault();
        const newSx = pos.x + dragOffsetX;
        const newSy = pos.y + dragOffsetY;

        sourceRelX = newSx - mirrorX;
        sourceRelY = newSy - height / 2;
        clampPositions();
      } else {
        hoverSource = isPointOnSource(pos.x, pos.y);
        canvas.style.cursor = hoverSource ? 'grab' : 'default';
      }
    }

    function onPointerUp(e) {
      if (isDraggingSource) {
        isDraggingSource = false;

        // ほとんど動かさずに光源をポンとタップした場合は、光源スイッチとして光を出す
        let upX = pointerDownX;
        let upY = pointerDownY;
        if (e.changedTouches && e.changedTouches.length > 0) {
          const rect = canvas.getBoundingClientRect();
          upX = e.changedTouches[0].clientX - rect.left;
          upY = e.changedTouches[0].clientY - rect.top;
        } else if (e.clientX !== undefined) {
          const rect = canvas.getBoundingClientRect();
          upX = e.clientX - rect.left;
          upY = e.clientY - rect.top;
        }

        const moveDist = Math.hypot(upX - pointerDownX, upY - pointerDownY);
        if (moveDist < 10 && !isLightActive) {
          startLightAnimation();
        } else {
          pulseTime = 0;
          updateStatusUI();
        }
      }
    }

    // イベントリスナー登録
    canvas.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    canvas.addEventListener('touchstart', onPointerDown, { passive: false });
    window.addEventListener('touchmove', onPointerMove, { passive: false });
    window.addEventListener('touchend', onPointerUp);

    // 「光源から光を出す」ボタン
    emitLightBtn.addEventListener('click', () => {
      startLightAnimation();
    });

    // 「光を消す」ボタン
    clearLightBtn.addEventListener('click', () => {
      clearLight();
    });

    // ステップボタン（1〜4の段階をタップして止めて見ることも可能）
    stepButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        const step = parseInt(btn.getAttribute('data-step'), 10);
        isLightActive = true;
        isAnimatingProcess = false;
        if (step === 1) animProgress = 0.24;
        if (step === 2) animProgress = 0.49;
        if (step === 3) animProgress = 0.79;
        if (step === 4) animProgress = 1.00;
        updateStatusUI();
      });
    });

    // 「文字・解説を表示」ON/OFFボタン（デフォルトはOFF）
    toggleTextBtn.addEventListener('click', () => {
      showLabels = !showLabels;
      textCheck.textContent = showLabels ? '☑' : '☐';
      if (showLabels) {
        statusBanner.classList.remove('hidden');
        statusBanner.classList.add('flex');
        toggleTextBtn.classList.replace('text-slate-300', 'text-amber-300');
        toggleTextBtn.classList.replace('border-slate-600', 'border-amber-400/70');
      } else {
        statusBanner.classList.add('hidden');
        statusBanner.classList.remove('flex');
        toggleTextBtn.classList.replace('text-amber-300', 'text-slate-300');
        toggleTextBtn.classList.replace('border-amber-400/70', 'border-slate-600');
      }
    });

    // 「対称の線を引く」ON/OFFボタン（デフォルトはOFF）
    toggleSymmetryBtn.addEventListener('click', () => {
      showSymmetryGuide = !showSymmetryGuide;
      symCheck.textContent = showSymmetryGuide ? '☑' : '☐';
      if (showSymmetryGuide) {
        toggleSymmetryBtn.classList.replace('text-slate-300', 'text-cyan-300');
        toggleSymmetryBtn.classList.replace('border-slate-600', 'border-cyan-500/70');
      } else {
        toggleSymmetryBtn.classList.replace('text-cyan-300', 'text-slate-300');
        toggleSymmetryBtn.classList.replace('border-cyan-500/70', 'border-slate-600');
      }
    });

    // 「位置リセット」ボタン
    resetBtn.addEventListener('click', () => {
      setInitialPositions();
      clearLight();
    });

    // ウィンドウリサイズ対応
    window.addEventListener('resize', () => {
      resizeCanvas();
    });

    // 初期化・アニメーション開始
    window.onload = () => {
      resizeCanvas();
      setInitialPositions();
      updateStatusUI();
      render();
    };
  </script>
</body>
</html>
